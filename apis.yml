aid: grapes
name: Grapes
description: >-
  Grape (Grape Protocol / GrapeDAO, built by Grape-Labs) is Solana-based
  decentralized infrastructure that gives online communities and DAOs a set of
  mainnet-ready primitives for identity, reputation, verification, access
  control, rewards, and governance. Its products include OG (Vine) Reputation
  Spaces for season-based on-chain reputation, Grape Verification for identity
  attestation, the Grape Access Protocol (GPASS) for token/credential-gated
  access, a GSPL DAO directory, a multi-chain Grape Wallet, and a suite of
  Discord automation bots. Grape ships no REST/OpenAPI surface; developers
  integrate through first-party TypeScript SDKs (npm) that wrap its Solana
  programs directly. Backed by Multicoin Capital, it was surfaced as a VC
  portfolio lead and enriched into the API Evangelist network.
